server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Un archivo estático inexistente debe dar 404, no index.html
  location /static/ {
    try_files $uri =404;
  }

  # BrowserRouter: las rutas como /menuad se resuelven en el cliente
  location / {
    try_files $uri $uri/ /index.html;
  }
}
